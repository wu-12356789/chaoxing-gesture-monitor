services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - SIGN_DOMAIN=${SIGN_DOMAIN:?Set SIGN_DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
